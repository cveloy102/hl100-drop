[package]
name = "hl100-drop"
version = "1.1.4"
edition = "2021"
description = "DROP: передача файлов и папок по локальной сети"

[[bin]]
name = "hl100-drop"
path = "src/main.rs"

[dependencies]
hl100_core = { path = "../../core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
ureq = "3"
sha2 = "0.11"
async-channel = "2"
