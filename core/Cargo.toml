[package]
name = "hl100_core"
version = "1.1.2"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
