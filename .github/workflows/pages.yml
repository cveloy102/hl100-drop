name: Сайт DROP
on:
  push:
    branches: [codex/initial-implementation]
    paths: ['site/**', 'docs/images/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    name: Публикация GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Подготовка изображений
        run: |
          mkdir -p site/images
          cp docs/images/* site/images/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Деплой
        id: deployment
        uses: actions/deploy-pages@v4
