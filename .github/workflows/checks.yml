name: Сборка и проверка
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - run: bash scripts/build-macos.sh
      - run: bash scripts/test-macos.sh
      - name: Скриншоты настоящего интерфейса AppKit
        run: |
          mkdir -p artifacts/screenshots
          HL100_UI_SMOKE_PATH="$PWD/artifacts/screenshots/macos-main.png" artifacts/macos/'HL100 Drop.app'/Contents/MacOS/HL100Drop --ui-smoke
          HL100_UI_SMOKE_PATH="$PWD/artifacts/screenshots/macos-settings.png" artifacts/macos/'HL100 Drop.app'/Contents/MacOS/HL100Drop --ui-smoke --ui-settings-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: macos-screenshots
          path: artifacts/screenshots/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-installer
          path: artifacts/HL100Drop-*-universal.dmg
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Зависимости GTK 4
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev librsvg2-common desktop-file-utils appstream patchelf file
      - name: Проверка desktop-файла и AppStream
        run: |
          desktop-file-validate apps/linux/data/ru.hl100.drop.desktop
          appstreamcli validate --no-net apps/linux/data/ru.hl100.drop.metainfo.xml
      - name: linuxdeploy и плагин GTK
        run: |
          mkdir -p .tools && cd .tools
          curl -fsSLo linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLo linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Сборка .deb и AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          LINUXDEPLOY: ${{ github.workspace }}/.tools/linuxdeploy-x86_64.AppImage
        run: bash scripts/build-linux.sh
      - name: Пакет устанавливается и запускается
        run: |
          sudo apt-get install -y ./artifacts/hl100-drop_*_amd64.deb xvfb dbus-x11
          export HL100_SETTINGS_PATH="$RUNNER_TEMP/drop/settings.json"
          mkdir -p "$RUNNER_TEMP/drop/in"
          echo "{\"name\":\"CI\",\"folder\":\"$RUNNER_TEMP/drop/in\",\"configured\":true,\"check_updates\":false}" > "$HL100_SETTINGS_PATH"
          dbus-run-session -- xvfb-run -a timeout 8 hl100-drop || test $? -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            artifacts/hl100-drop_*_amd64.deb
            artifacts/HL100Drop-*-x86_64.AppImage
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Версия для имени бандла
        run: echo "DROP_VERSION=$(grep -m1 '^version' apps/linux/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          manifest-path: apps/linux/flatpak/ru.hl100.drop.yml
          bundle: HL100Drop-${{ env.DROP_VERSION }}-x86_64.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: cargo build --release --locked
      - shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Проверка запуска в трей и повторного открытия
        shell: pwsh
        run: ./scripts/test-windows-startup.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifacts/HL100DropSetup-*.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.3.13750724'
      - name: Native Android libraries
        run: |
          export NDK="$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/aarch64-linux-android31-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK/x86_64-linux-android31-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS='-C link-arg=-Wl,-z,max-page-size=16384'
          export CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS='-C link-arg=-Wl,-z,max-page-size=16384'
          cargo build --release --locked --target aarch64-linux-android
          cargo build --release --locked --target x86_64-linux-android
          mkdir -p apps/android/app/src/main/jniLibs/{arm64-v8a,x86_64}
          cp target/aarch64-linux-android/release/libhl100_core.so apps/android/app/src/main/jniLibs/arm64-v8a/
          cp target/x86_64-linux-android/release/libhl100_core.so apps/android/app/src/main/jniLibs/x86_64/
      - name: Build APK and lint
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
